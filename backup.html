<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시가 직구 세금 계산기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --primary: #1d4ed8;
      --primary-dark: #1e40af;
      --accent: #f5f8ff;
      --bg: #f3f5f8;
      --white: #ffffff;
      --surface: #ffffff;
      --text: #162033;
      --muted: #5f6c84;
      --border: #d7e1f0;
      --safe: #e9f8ef;
      --safe-text: #127c43;
      --warn: #fff4e6;
      --warn-text: #b35b00;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      --soft-shadow: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Avenir Next", "SUIT Variable", "Pretendard Variable", "Noto Sans KR", sans-serif;
      margin: 0;
      padding: 1rem;
      background: var(--bg);
      color: var(--text);
    }

    h2 {
      font-size: 1.55rem;
      letter-spacing: -0.03em;
      margin: 0 0 0.62rem;
      text-align: center;
      color: #101828;
    }

    .container {
      max-width: 460px;
      margin: 0 auto;
      background: var(--surface);
      padding: 0.88rem;
      border-radius: 18px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.62rem;
    }

    .panel {
      padding: 0.78rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--white);
      box-shadow: var(--soft-shadow);
    }

    .finance-panel {
      background: var(--accent);
      padding: 0.7rem;
    }

    .input-panel {
      background: #ffffff;
    }

    .input-row {
      display: flex;
      flex-direction: column;
      gap: 0.42rem;
    }

    .rate-grid,
    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.5rem;
    }

    .currency-select-row {
      margin-bottom: 0.54rem;
    }

    .field-grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .panel-headline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.55rem;
      margin-bottom: 0.42rem;
    }

    .finance-headline {
      flex-wrap: nowrap;
    }

    .panel-name {
      font-size: 0.95rem;
      font-weight: 800;
      color: #24324a;
    }

    .headline-meta {
      display: none;
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .headline-meta.show {
      display: inline;
    }

    .headline-meta.error {
      color: var(--warn-text);
    }

    .rate-card {
      padding: 0.52rem 0.62rem;
      border-radius: 10px;
      border: 1px solid #dbe5f4;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.45rem;
    }

    .rate-label {
      font-size: 0.83rem;
      font-weight: 700;
      color: #344054;
      margin-bottom: 0;
      white-space: nowrap;
    }

    .rate-value {
      font-size: 0.94rem;
      font-weight: 700;
      color: #101828;
      word-break: keep-all;
      text-align: right;
    }

    label {
      font-size: 0.98rem;
      font-weight: 600;
      color: #344054;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 0.72rem 0.78rem;
      font-size: 1rem;
      border: 1px solid #c9d6ea;
      border-radius: 10px;
      background: #fff;
      color: var(--text);
    }

    input[type="text"]:focus,
    select:focus {
      outline: 2px solid rgba(15, 98, 254, 0.14);
      border-color: var(--primary);
    }

    input[type="checkbox"] {
      transform: scale(1.12);
      margin-right: 0.55rem;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-top: 0.54rem;
      padding: 0.7rem 0.78rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #f8fafc;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      font-weight: 700;
      color: #344054;
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .toggle-copy {
      font-size: 0.84rem;
      color: var(--muted);
      text-align: right;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.62rem;
    }

    button {
      padding: 0.78rem 0.9rem;
      font-size: 0.98rem;
      font-weight: 700;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      box-shadow: none;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    button:hover {
      background-color: var(--primary-dark);
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.75;
      transform: none;
    }

    .secondary-button {
      background: #eef2ff;
      color: #1d4ed8;
      box-shadow: none;
    }

    .secondary-button:hover {
      background: #dfe9ff;
    }

    .share-action {
      background-color: #16a34a;
      box-shadow: none;
    }

    .share-action:hover {
      background-color: #15803d;
    }

    .result-panel {
      display: none;
      background: #fcfdff;
      padding: 0.88rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      white-space: pre-wrap;
      font-size: 0.96rem;
      line-height: 1.6;
      margin-top: 0;
      min-height: 168px;
    }

    .result-panel.show {
      display: block;
    }

    .footer-note {
      margin-top: 0.58rem;
      text-align: center;
      font-size: 0.76rem;
      color: var(--muted);
    }

    .loading {
      opacity: 0.7;
      pointer-events: none;
    }

    @media (max-width: 480px) {
      body {
        padding: 0.7rem;
      }

      .container {
        padding: 0.72rem;
      }

      h2 {
        font-size: 1.38rem;
      }

      .input-group {
        gap: 0.68rem;
      }

      .panel {
        padding: 0.7rem;
      }

      .rate-grid,
      .button-row,
      .panel-headline {
        gap: 0.52rem;
      }

      .field-grid,
      .field-grid.three {
        grid-template-columns: 1fr;
        gap: 0.52rem;
      }

      .panel-headline {
        flex-direction: column;
        align-items: flex-start;
      }

      .finance-headline {
        flex-direction: row;
        align-items: center;
      }

      .headline-meta {
        white-space: normal;
      }

      input[type="text"],
      select,
      button {
        padding: 0.72rem 0.78rem;
        font-size: 0.98rem;
      }

      .rate-value {
        font-size: 0.9rem;
      }

      .result-panel {
        min-height: 138px;
        font-size: 0.92rem;
      }
    }

    @media (max-width: 360px) {
      .rate-grid,
      .field-grid,
      .field-grid.three,
      .button-row {
        grid-template-columns: 1fr;
      }

      .toggle-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .toggle-copy {
        text-align: left;
      }
    }
  </style>
</head>

<body>
  <h2>📦 시가 직구 세금 계산기</h2>

  <div class="container" id="captureContainer">
    <div class="input-group">
      <div class="panel finance-panel">
        <div class="panel-headline finance-headline">
          <div class="panel-name">결제통화</div>
          <div class="headline-meta" id="limitNotice"></div>
        </div>

        <div class="input-row currency-select-row">
          <select id="currency"></select>
        </div>

        <div class="rate-grid">
          <div class="rate-card">
            <span class="rate-label" id="selectedRateLabel">USD</span>
            <strong class="rate-value" id="selectedRateInfo">불러오는 중...</strong>
          </div>
          <div class="rate-card">
            <span class="rate-label">USD</span>
            <strong class="rate-value" id="usdRateInfo">불러오는 중...</strong>
          </div>
        </div>
      </div>

      <div class="panel input-panel">
        <div class="panel-headline">
          <div class="panel-name">입력 정보</div>
        </div>

        <div class="field-grid three">
          <div class="input-row">
            <label for="weight">총 중량 (g)</label>
            <input type="text" inputmode="decimal" pattern="[0-9]+([.][0-9]+)?" id="weight" placeholder="예: 150" value="150">
          </div>
          <div class="input-row">
            <label for="price">상품 금액 (<span class="currency-label">USD</span>)</label>
            <input type="text" inputmode="decimal" pattern="[0-9]+([.][0-9]+)?" id="price" placeholder="예: 100" value="100">
          </div>
          <div class="input-row">
            <label for="shipping">배송비 (<span class="currency-label">USD</span>)</label>
            <input type="text" inputmode="decimal" pattern="[0-9]+([.][0-9]+)?" id="shipping" placeholder="예: 20" value="0">
          </div>
        </div>

        <div class="toggle-row">
          <label class="checkbox-label" for="over50">
            <input type="checkbox" id="over50"> 50스틱 초과
          </label>
          <div class="toggle-copy">체크 시 금액이 낮아도 관부가세 적용 여부를 함께 반영합니다.</div>
        </div>
      </div>

      <div class="button-row">
        <button type="button" id="calculateButton">세금 계산하기</button>
        <button type="button" class="share-action" id="shareButton">결과 공유하기</button>
      </div>

      <pre id="result" class="result-panel">값을 입력한 뒤 "세금 계산하기"를 누르세요.</pre>
      <div class="footer-note">made by 챠챠</div>
    </div>
  </div>

  <script>
    const CURRENCIES = {
      USD: { name: '미국 달러', symbol: '$', decimals: 2 },
      EUR: { name: '유로', symbol: '€', decimals: 2 },
      CHF: { name: '스위스 프랑', symbol: 'CHF ', decimals: 2 },
      HKD: { name: '홍콩 달러', symbol: 'HK$', decimals: 2 },
      GBP: { name: '영국 파운드', symbol: '£', decimals: 2 },
      CNY: { name: '중국 위안', symbol: 'CN¥', decimals: 2 },
      JPY: { name: '일본 엔', symbol: '¥', decimals: 0 },
      AUD: { name: '호주 달러', symbol: 'A$', decimals: 2 },
    };

    const CACHE_KEY = 'exchangeRateCacheV2';
    const SELECTED_CURRENCY_KEY = 'selectedCurrency';
    const ONE_HOUR = 60 * 60 * 1000;
    const DEFAULT_RESULT_TEXT = '값을 입력한 뒤 "세금 계산하기"를 누르세요.';

    let exchangeRates = {};
    let activeCurrency = 'USD';
    let currentRateRequestId = 0;

    window.addEventListener('DOMContentLoaded', initialize);

    async function initialize() {
      populateCurrencyOptions();
      restoreSelectedCurrency();
      bindEvents();
      updateCurrencyLabels();
      await updateRates(activeCurrency);
      setDefaultResult();
    }

    function populateCurrencyOptions() {
      const select = document.getElementById('currency');
      select.innerHTML = Object.entries(CURRENCIES)
        .map(([code, meta]) => `<option value="${code}">${code} · ${meta.name}</option>`)
        .join('');
    }

    function restoreSelectedCurrency() {
      const savedCurrency = localStorage.getItem(SELECTED_CURRENCY_KEY);
      if (savedCurrency && CURRENCIES[savedCurrency]) {
        activeCurrency = savedCurrency;
      }
      document.getElementById('currency').value = activeCurrency;
    }

    function bindEvents() {
      document.getElementById('currency').addEventListener('change', handleCurrencyChange);
      document.getElementById('calculateButton').addEventListener('click', () => calculate({ manual: true }));
      document.getElementById('shareButton').addEventListener('click', shareResult);

      ['weight', 'price', 'shipping'].forEach((id) => {
        document.getElementById(id).addEventListener('input', clearResultState);
      });

      document.getElementById('over50').addEventListener('change', clearResultState);
    }

    async function handleCurrencyChange(event) {
      activeCurrency = event.target.value;
      localStorage.setItem(SELECTED_CURRENCY_KEY, activeCurrency);
      updateCurrencyLabels();
      setDefaultResult();
      await updateRates(activeCurrency);
    }

    function updateCurrencyLabels() {
      document.querySelectorAll('.currency-label').forEach((node) => {
        node.textContent = activeCurrency;
      });
      document.getElementById('selectedRateLabel').textContent = activeCurrency;
    }

    function getCachedRates() {
      try {
        return JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
      } catch (error) {
        console.error('환율 캐시 파싱 실패:', error);
        return {};
      }
    }

    function setCachedRate(currency, payload) {
      const cache = getCachedRates();
      cache[currency] = payload;
      localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
    }

    async function getExchangeRate(currency, options = {}) {
      const { forceRefresh = false } = options;
      const now = Date.now();

      if (!forceRefresh && exchangeRates[currency] && now - exchangeRates[currency].fetchedAt < ONE_HOUR) {
        return exchangeRates[currency];
      }

      const cached = getCachedRates()[currency];
      if (!forceRefresh && cached && now - cached.fetchedAt < ONE_HOUR) {
        exchangeRates[currency] = cached;
        return cached;
      }

      const url = `https://m.search.naver.com/p/csearch/content/qapirender.nhn?key=calculator&pkid=141&q=%ED%99%98%EC%9C%A8&where=m&u1=keb&u6=standardUnit&u7=0&u3=${currency}&u4=KRW&u8=down&u2=1`;
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`환율 조회 실패 (${currency}): ${response.status}`);
      }

      const data = await response.json();
      const baseValue = parseFloat(String(data.country[0].value).replace(/,/g, ''));
      const quoteValue = parseFloat(String(data.country[1].value).replace(/,/g, ''));

      if (!Number.isFinite(baseValue) || !Number.isFinite(quoteValue) || baseValue === 0) {
        throw new Error(`환율 데이터 파싱 실패 (${currency})`);
      }

      const ratePayload = {
        currency,
        rate: quoteValue / baseValue,
        fetchedAt: now
      };

      exchangeRates[currency] = ratePayload;
      setCachedRate(currency, ratePayload);
      return ratePayload;
    }

    async function updateRates(currency, options = {}) {
      const requestId = ++currentRateRequestId;
      renderRateCards();
      hideThresholdNotice();

      try {
        const usdPromise = getExchangeRate('USD', options);
        const selectedPromise = currency === 'USD' ? usdPromise : getExchangeRate(currency, options);
        const [usdRate, selectedRate] = await Promise.all([usdPromise, selectedPromise]);

        if (requestId !== currentRateRequestId) {
          return;
        }

        exchangeRates.USD = usdRate;
        exchangeRates[currency] = selectedRate;
        renderRateCards();
        updateThresholdNotice();
      } catch (error) {
        console.error('환율 불러오기 실패:', error);
        document.getElementById('selectedRateInfo').textContent = `${currency} 조회 실패`;
        document.getElementById('usdRateInfo').textContent = 'USD 조회 실패';
        document.getElementById('limitNotice').textContent = '환율 불러오기 실패';
        document.getElementById('limitNotice').className = 'headline-meta error show';
      }
    }

    function renderRateCards() {
      const selectedRate = exchangeRates[activeCurrency];
      const usdRate = exchangeRates.USD;

      document.getElementById('selectedRateInfo').textContent = selectedRate
        ? formatKrw(selectedRate.rate)
        : '불러오는 중...';

      document.getElementById('usdRateInfo').textContent = usdRate
        ? formatKrw(usdRate.rate)
        : '불러오는 중...';
    }

    function updateThresholdNotice() {
      const notice = document.getElementById('limitNotice');
      const usdRate = exchangeRates.USD?.rate;
      const selectedRate = exchangeRates[activeCurrency]?.rate;

      if (activeCurrency === 'USD' || !usdRate || !selectedRate) {
        hideThresholdNotice();
        return;
      }

      const thresholdInSelectedCurrency = getThresholdInCurrency(usdRate, selectedRate);
      notice.textContent = `150달러 기준(${formatAmountWithCode(thresholdInSelectedCurrency, activeCurrency)})`;
      notice.className = 'headline-meta show';
    }

    function hideThresholdNotice() {
      const notice = document.getElementById('limitNotice');
      notice.textContent = '';
      notice.className = 'headline-meta';
    }

    function getThresholdInCurrency(usdRate, selectedRate) {
      return (150 * usdRate) / selectedRate;
    }

    function getInputValues() {
      const weight = parseFloat(document.getElementById('weight').value);
      const price = parseFloat(document.getElementById('price').value);
      const shipping = parseFloat(document.getElementById('shipping').value);
      const isOver50 = document.getElementById('over50').checked;

      if (![weight, price, shipping].every((value) => Number.isFinite(value) && value >= 0)) {
        return null;
      }

      return { weight, price, shipping, isOver50 };
    }

    function clearResultState() {
      setDefaultResult();
      updateThresholdNotice();
    }

    function calculate(options = {}) {
      const { manual = false } = options;
      const values = getInputValues();

      if (!values) {
        document.getElementById('result').textContent = '중량, 상품 금액, 배송비를 모두 숫자로 입력해 주세요.';
        document.getElementById('result').classList.add('show');
        updateThresholdNotice();
        return null;
      }

      const usdRate = exchangeRates.USD?.rate;
      const selectedRate = exchangeRates[activeCurrency]?.rate;

      if (!usdRate || !selectedRate) {
        document.getElementById('result').textContent = manual
          ? '환율 정보를 아직 불러오지 못했습니다. 잠시 후 다시 계산해 주세요.'
          : DEFAULT_RESULT_TEXT;
        if (manual) {
          document.getElementById('result').classList.add('show');
        } else {
          document.getElementById('result').classList.remove('show');
        }
        updateThresholdNotice();
        return null;
      }

      const summary = calculateTaxSummary(values, {
        currency: activeCurrency,
        usdRate,
        selectedRate
      });

      document.getElementById('result').textContent =
        `총 중량: ${summary.weight}g\n` +
        `50스틱 초과 여부: ${summary.isOver50 ? '예' : '아니오'}\n\n` +
        `총 결제 금액: ${formatMoney(summary.totalAmount, summary.currency)} (약 ${Math.round(summary.totalKrw).toLocaleString('ko-KR')}원) (${summary.currency})\n\n` +
        `담배소비세: ${formatKrw(summary.tobaccoTax)}\n` +
        `지방교육세: ${formatKrw(summary.eduTax)}\n` +
        `개별소비세: ${formatKrw(summary.indivTax)}\n` +
        `관세/부가세: ${formatKrw(summary.dubuTax)}\n\n` +
        `총 세금: ${formatKrw(summary.totalTax)}\n` +
        `총 예상 결제금액: ${formatKrw(summary.totalKrw + summary.totalTax)}`;

      document.getElementById('result').classList.add('show');
      updateThresholdNotice();
      return summary;
    }

    function calculateTaxSummary(values, rates) {
      const { weight, price, shipping, isOver50 } = values;
      const { currency, usdRate, selectedRate } = rates;

      const totalAmount = price + shipping;
      const totalKrw = totalAmount * selectedRate;
      const totalUsdEquivalent = totalKrw / usdRate;
      const thresholdInSelectedCurrency = getThresholdInCurrency(usdRate, selectedRate);
      const isOverUsdThreshold = totalUsdEquivalent > 150;

      let dubuTax = 0;
      if (isOverUsdThreshold || isOver50) {
        const dutyTax = totalKrw * 0.4;
        const surtax = dutyTax * 0.1;
        dubuTax = dutyTax + surtax;
      }

      const tobaccoTax = weight * 103;
      const eduTax = tobaccoTax * 0.44;
      const indivTax = weight * 61 > 10000 ? weight * 61 : 0;
      const totalTax = dubuTax + tobaccoTax + eduTax + indivTax;

      return {
        currency,
        weight,
        price,
        shipping,
        totalAmount,
        totalKrw,
        totalUsdEquivalent,
        thresholdInSelectedCurrency,
        isOverUsdThreshold,
        isOver50,
        tobaccoTax,
        eduTax,
        indivTax,
        dubuTax,
        totalTax
      };
    }

    function setDefaultResult() {
      const result = document.getElementById('result');
      result.textContent = DEFAULT_RESULT_TEXT;
      result.classList.remove('show');
    }

    function formatMoney(amount, currency) {
      const meta = CURRENCIES[currency] || CURRENCIES.USD;
      return `${meta.symbol}${amount.toLocaleString('en-US', {
        minimumFractionDigits: meta.decimals,
        maximumFractionDigits: meta.decimals
      })}`;
    }

    function formatAmountWithCode(amount, currency) {
      const meta = CURRENCIES[currency] || CURRENCIES.USD;
      return `${amount.toLocaleString('en-US', {
        minimumFractionDigits: meta.decimals,
        maximumFractionDigits: meta.decimals
      })}${currency}`;
    }

    function formatKrw(amount) {
      return `${Math.round(amount).toLocaleString('ko-KR')}원`;
    }

    async function shareResult() {
      const shareButton = document.getElementById('shareButton');
      const container = document.getElementById('captureContainer');
      const summary = calculate({ manual: true });

      if (!summary) {
        return;
      }

      try {
        shareButton.textContent = '캡처 중...';
        shareButton.classList.add('loading');
        shareButton.disabled = true;

        const canvas = await html2canvas(container, {
          backgroundColor: '#ffffff',
          scale: 2,
          useCORS: true,
          allowTaint: true
        });

        const blob = await new Promise((resolve) => {
          canvas.toBlob(resolve, 'image/png', 0.9);
        });

        const file = new File([blob], '세금계산결과.png', { type: 'image/png' });

        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: '시가 직구 세금 계산 결과',
            text: '시가 직구 세금 계산 결과를 확인해보세요.',
            files: [file]
          });
        } else {
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = '세금계산결과.png';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
          alert('이미지가 다운로드되었습니다.');
        }
      } catch (error) {
        console.error('공유 실패:', error);
      } finally {
        shareButton.textContent = '결과 공유하기';
        shareButton.classList.remove('loading');
        shareButton.disabled = false;
      }
    }
  </script>
</body>

</html>
