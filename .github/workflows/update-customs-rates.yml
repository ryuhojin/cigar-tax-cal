name: Update customs exchange rates

on:
  schedule:
    - cron: "15 16 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Korea Customs Service rates
        run: node scripts/update-customs-rates.mjs
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}

      - name: Commit updated rates
        run: |
          if git diff --quiet -- customs-rates.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customs-rates.json
          git commit -m "chore: update weekly customs rates"
          git push
